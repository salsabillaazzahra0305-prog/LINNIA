<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja | LINNIA Pempek & Tekwan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#FAF7F2] text-[#2B1408] font-sans min-h-screen p-4 sm:p-8">
  <div class="max-w-2xl mx-auto space-y-5">
    
    <!-- Tombol Kembali ke Menu Makanan -->
    <a href="index.php#menu" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-600 hover:text-[#2B1408]">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Menu Makanan
    </a>

    <!-- Rincian Daftar Isi Keranjang -->
    <div class="bg-white rounded-2xl p-5 border border-[#E8DFC8] shadow-sm">
      <h2 class="font-bold text-base border-b pb-3 mb-4 flex items-center justify-between">
        <span>Isi Keranjang Belanja</span>
        <span id="cart-item-count" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">0 Menu</span>
      </h2>

      <div id="cart-items-container" class="divide-y divide-gray-100">
        <!-- Render otomatis via JS -->
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center font-bold">
        <span>Total Semua:</span>
        <span id="cart-grand-total" class="text-[#C07A23] text-lg">Rp 0</span>
      </div>
    </div>

    <!-- Form Checkout Keranjang ke WhatsApp -->
    <div class="bg-white rounded-2xl p-5 border border-[#E8DFC8] shadow-sm space-y-3">
      <h3 class="font-bold text-sm text-gray-900 border-b pb-2">Data Pengiriman Pesanan Keranjang</h3>
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemesan *</label>
        <input type="text" id="cart-cust-name" placeholder="Nama Anda" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor WhatsApp *</label>
        <input type="tel" id="cart-cust-phone" placeholder="Nomor WA aktif" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Lengkap *</label>
        <textarea id="cart-cust-address" rows="2" placeholder="Alamat lengkap penerima" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none"></textarea>
      </div>

      <button onclick="checkoutCartWhatsApp()" class="w-full mt-4 py-3 bg-[#25D366] hover:bg-[#1ebd5b] text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow-sm transition">
        <i class="fa-brands fa-whatsapp text-base"></i>
        <span>Pesan Semua via WhatsApp</span>
      </button>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", renderCartPage);

    function renderCartPage() {
      const cart = JSON.parse(localStorage.getItem("linnia_cart") || "[]");
      const container = document.getElementById("cart-items-container");
      const totalEl = document.getElementById("cart-grand-total");
      const badgeEl = document.getElementById("cart-item-count");

      if (cart.length === 0) {
        container.innerHTML = `<div class="py-8 text-center text-xs text-gray-400">Keranjang masih kosong. Silakan pilih menu terlebih dahulu.</div>`;
        totalEl.textContent = "Rp 0";
        badgeEl.textContent = "0 Menu";
        return;
      }

      let grandTotal = 0;
      badgeEl.textContent = `${cart.length} Menu`;

      container.innerHTML = cart.map((item, index) => {
        const subtotal = item.price * item.qty;
        grandTotal += subtotal;
        return `
          <div class="py-3 flex items-center justify-between gap-3">
            <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover border" onerror="this.src='https://placehold.co/80x80?text=Menu'">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-gray-900">${item.title}</h4>
              <p class="text-[11px] text-gray-500">${item.qty} Pack × Rp ${item.price.toLocaleString("id-ID")}</p>
            </div>
            <div class="text-right">
              <span class="block font-bold text-xs text-[#C07A23]">Rp ${subtotal.toLocaleString("id-ID")}</span>
              <button onclick="deleteCartItem(${index})" class="text-[10px] text-red-500 hover:underline">Hapus</button>
            </div>
          </div>
        `;
      }).join("");

      totalEl.textContent = `Rp ${grandTotal.toLocaleString("id-ID")}`;
    }

    function deleteCartItem(index) {
      let cart = JSON.parse(localStorage.getItem("linnia_cart") || "[]");
      cart.splice(index, 1);
      localStorage.setItem("linnia_cart", JSON.stringify(cart));
      renderCartPage();
    }

    function checkoutCartWhatsApp() {
      const cart = JSON.parse(localStorage.getItem("linnia_cart") || "[]");
      if (cart.length === 0) {
        alert("Keranjang masih kosong!");
        return;
      }

      const name = document.getElementById("cart-cust-name").value.trim();
      const phone = document.getElementById("cart-cust-phone").value.trim();
      const address = document.getElementById("cart-cust-address").value.trim();

      if (!name || !phone || !address) {
        alert("Mohon lengkapi data pengiriman!");
        return;
      }

      let grandTotal = 0;
      const itemListText = cart.map((item, i) => {
        const sub = item.price * item.qty;
        grandTotal += sub;
        return `${i + 1}. ${item.title} (${item.qty} Pack) = Rp ${sub.toLocaleString("id-ID")}`;
      }).join("\n");

      const text = `*PESANAN KERANJANG - LINNIA PEMPEK & TEKWAN*
----------------------------------------
${itemListText}
----------------------------------------
*Total Pembayaran:* Rp ${grandTotal.toLocaleString("id-ID")}
*Kemasan:* Frozen Pack (Kemasan Vakum Beku)

*Nama Pemesan:* ${name}
*Nomor WhatsApp:* ${phone}
*Alamat Lengkap:* ${address}`;

      window.open(`https://wa.me/62895359511378?text=${encodeURIComponent(text)}`, "_blank");
    }
  </script>
</body>
</html>
