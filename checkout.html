<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beli Langsung | LINNIA Pempek & Tekwan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#FAF7F2] text-[#2B1408] font-sans min-h-screen p-4 sm:p-8">
  <div class="max-w-xl mx-auto space-y-5">
    
    <!-- Tombol Kembali -->
    <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-600 hover:text-[#2B1408]">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Menu
    </a>

    <!-- Rincian Produk yang Dibeli Langsung -->
    <div class="bg-white rounded-2xl p-5 border border-[#E8DFC8] shadow-sm">
      <h2 class="font-bold text-base border-b pb-3 mb-4 flex items-center justify-between">
        <span>Rincian Pembelian Langsung</span>
        <span class="text-xs text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full font-medium">Beli Sekarang</span>
      </h2>

      <div class="flex items-center gap-4">
        <img id="buy-img" src="" alt="Produk" class="w-16 h-16 rounded-xl object-cover border" onerror="this.src='https://placehold.co/100x100?text=Produk'">
        <div class="flex-1">
          <h3 id="buy-title" class="font-bold text-sm text-gray-900">-</h3>
          <p id="buy-qty-price" class="text-xs text-gray-500 mt-0.5">-</p>
          <span class="inline-block text-[11px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded mt-1">Kemasan: Frozen Pack (Vakum Beku)</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400 block">Subtotal</span>
          <span id="buy-subtotal" class="font-bold text-sm text-[#C07A23]">Rp 0</span>
        </div>
      </div>
    </div>

    <!-- Form Data Pengiriman -->
    <div class="bg-white rounded-2xl p-5 border border-[#E8DFC8] shadow-sm space-y-3">
      <h3 class="font-bold text-sm text-gray-900 border-b pb-2">Informasi Pengiriman</h3>
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemesan *</label>
        <input type="text" id="cust-name" placeholder="Contoh: Salsa" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor WhatsApp *</label>
        <input type="tel" id="cust-phone" placeholder="Contoh: 08123456789" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Lengkap *</label>
        <textarea id="cust-address" rows="2" placeholder="Nama Jalan, RT/RW, Kecamatan, Kota" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Catatan Pesanan (Opsional)</label>
        <input type="text" id="cust-note" placeholder="Contoh: Cuko agak pedas" class="w-full px-3 py-2 text-xs border rounded-lg focus:outline-none">
      </div>

      <button onclick="sendDirectWhatsApp()" class="w-full mt-4 py-3 bg-[#25D366] hover:bg-[#1ebd5b] text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow-sm transition">
        <i class="fa-brands fa-whatsapp text-base"></i>
        <span>Kirim Pesanan Langsung ke WhatsApp</span>
      </button>
    </div>

  </div>

  <script>
    let directData = null;

    document.addEventListener("DOMContentLoaded", () => {
      const stored = localStorage.getItem("linnia_direct_buy");
      if (!stored) {
        window.location.href = "index.php#menu";
        return;
      }

      directData = JSON.parse(stored);
      document.getElementById("buy-img").src = directData.img || "";
      document.getElementById("buy-title").textContent = directData.title;
      document.getElementById("buy-qty-price").textContent = `${directData.qty} Pack × Rp ${directData.unitPrice.toLocaleString("id-ID")}`;
      document.getElementById("buy-subtotal").textContent = `Rp ${directData.totalPrice.toLocaleString("id-ID")}`;
    });

    function sendDirectWhatsApp() {
      const name = document.getElementById("cust-name").value.trim();
      const phone = document.getElementById("cust-phone").value.trim();
      const address = document.getElementById("cust-address").value.trim();
      const note = document.getElementById("cust-note").value.trim() || "-";

      if (!name || !phone || !address) {
        alert("Mohon lengkapi Nama, Nomor WhatsApp, dan Alamat Pengiriman!");
        return;
      }

      const text = `*PESANAN LANGSUNG - LINNIA PEMPEK & TEKWAN*
----------------------------------------
*Item:* ${directData.title}
*Jumlah:* ${directData.qty} Pack
*Kemasan:* Frozen Pack (Vakum Beku)
*Total Biaya:* Rp ${directData.totalPrice.toLocaleString("id-ID")}
----------------------------------------
*Nama Pemesan:* ${name}
*Nomor WhatsApp:* ${phone}
*Alamat Lengkap:* ${address}
*Catatan:* ${note}`;

      window.open(`https://wa.me/62895359511378?text=${encodeURIComponent(text)}`, "_blank");
    }
  </script>
</body>
</html>
